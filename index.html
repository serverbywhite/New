<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Code Editor - Cyberpunk Layout</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel-bg: #111118;
            --border: #1e1e2e;
            --cyan: #00e5ff;
            --magenta: #ff00e5;
            --yellow: #ffd740;
            --green: #00ff88;
            --orange: #ff6d3a;
            --blue: #448aff;
            --text: #c8ccd4;
            --text-dim: #6b6f7b;
            --glow-cyan: 0 0 30px rgba(0, 229, 255, 0.4);
            --glow-magenta: 0 0 30px rgba(255, 0, 229, 0.4);
            --glow-green: 0 0 30px rgba(0, 255, 136, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: crosshair;
            perspective: 1200px;
            -webkit-user-select: none;
            user-select: none;
        }

        /* === Canvas Background Particles === */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* === Grid Floor (3D illusion) === */
        .grid-floor {
            position: fixed;
            bottom: -20%;
            left: 50%;
            transform: translateX(-50%) rotateX(60deg);
            width: 140vw;
            height: 140vw;
            background:
                repeating-linear-gradient(0deg, transparent, transparent 39px,
                    rgba(0, 229, 255, 0.06) 39px,
                    rgba(0, 229, 255, 0.06) 40px),
                repeating-linear-gradient(90deg, transparent, transparent 39px,
                    rgba(0, 229, 255, 0.06) 39px,
                    rgba(0, 229, 255, 0.06) 40px);
            z-index: 0;
            pointer-events: none;
            animation: gridPulse 4s ease-in-out infinite;
            mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.7) 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.7) 0%, transparent 70%);
        }

        @keyframes gridPulse {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* === Main Container === */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }

        /* === Central Editor Panel (3D Card) === */
        .editor-panel {
            width: 750px;
            max-width: 92vw;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                var(--glow-cyan);
            transform-style: preserve-3d;
            transition: transform 0.2s ease, box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
            animation: floatPanel 6s ease-in-out infinite;
        }

        .editor-panel::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 18px;
            background: linear-gradient(135deg,
                    var(--cyan), var(--magenta), var(--blue), var(--cyan));
            z-index: -1;
            opacity: 0.5;
            filter: blur(15px);
            animation: borderGlow 4s linear infinite;
            background-size: 300% 300%;
        }

        .editor-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.02) 0%,
                    transparent 30%,
                    transparent 70%,
                    rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
        }

        @keyframes borderGlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes floatPanel {
            0%,
            100% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-8px);
            }
            50% {
                transform: translateY(-3px);
            }
            75% {
                transform: translateY(-10px);
            }
        }

        /* === Editor Title Bar === */
        .title-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--border);
            position: relative;
            z-index: 2;
        }
        .title-dots {
            display: flex;
            gap: 7px;
        }
        .title-dots span {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            display: block;
            transition: all 0.3s;
            cursor: pointer;
        }
        .title-dots span:nth-child(1) {
            background: #ff5f57;
            box-shadow: 0 0 12px #ff5f57;
        }
        .title-dots span:nth-child(2) {
            background: #ffbd2e;
            box-shadow: 0 0 12px #ffbd2e;
        }
        .title-dots span:nth-child(3) {
            background: #28ca41;
            box-shadow: 0 0 12px #28ca41;
        }
        .title-dots span:hover {
            transform: scale(1.4);
            filter: brightness(1.5);
        }
        .title-text {
            color: var(--text-dim);
            font-size: 12px;
            margin-left: 8px;
            letter-spacing: 0.5px;
        }
        .title-tab {
            background: var(--panel-bg);
            color: var(--text);
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 8px 8px 0 0;
            border: 1px solid var(--border);
            border-bottom: none;
            margin-left: 20px;
            position: relative;
            top: 1px;
            letter-spacing: 0.3px;
        }
        .title-tab .dot-indicator {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            margin-right: 6px;
            animation: dotBlink 1.5s ease-in-out infinite;
        }
        @keyframes dotBlink {
            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 6px var(--green);
            }
            50% {
                opacity: 0.3;
                box-shadow: 0 0 2px var(--green);
            }
        }

        /* === Code Content === */
        .code-content {
            padding: 20px 24px;
            position: relative;
            z-index: 2;
            min-height: 350px;
            font-size: 13.5px;
            line-height: 2;
            letter-spacing: 0.2px;
            color: var(--text);
            overflow: hidden;
        }
        .line-numbers {
            position: absolute;
            left: 20px;
            top: 20px;
            color: #3a3d4a;
            font-size: 13px;
            line-height: 2;
            text-align: right;
            width: 30px;
            pointer-events: none;
            z-index: 1;
        }
        .code-lines {
            padding-left: 45px;
            position: relative;
            z-index: 1;
        }
        .code-lines .line {
            white-space: pre;
            transition: all 0.3s;
        }
        .code-lines .line.cursor-line::after {
            content: '▎';
            color: var(--cyan);
            animation: cursorBlink 1s step-end infinite;
            margin-left: 2px;
            font-size: 14px;
        }
        @keyframes cursorBlink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* Syntax colors */
        .keyword {
            color: #c678dd;
            font-weight: 600;
        }
        .function-name {
            color: #61afef;
            font-weight: 500;
        }
        .string {
            color: #98c379;
        }
        .comment {
            color: #5c6370;
            font-style: italic;
        }
        .number {
            color: #d19a66;
        }
        .type {
            color: #e5c07b;
        }
        .operator {
            color: #abb2bf;
        }
        .variable {
            color: #e06c75;
        }
        .bracket {
            color: #ffd740;
        }
        .property {
            color: #56b6c2;
        }
        .tag {
            color: #e06c75;
        }
        .attr {
            color: #d19a66;
        }

        /* === Floating Mini Panels === */
        .mini-panels {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            transform-style: preserve-3d;
        }
        .mini-panel {
            width: 200px;
            height: 140px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .mini-panel:nth-child(1) {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), var(--glow-magenta);
        }
        .mini-panel:nth-child(2) {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), var(--glow-green);
        }
        .mini-panel:nth-child(3) {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), var(--glow-cyan);
        }
        .mini-panel:hover {
            transform: translateZ(30px) rotateX(-2deg) rotateY(2deg) scale(1.05);
            z-index: 20;
        }
        .mini-panel .mini-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        .mini-panel .mini-code {
            font-size: 10px;
            line-height: 1.8;
            color: var(--text);
            position: relative;
            z-index: 1;
            opacity: 0.85;
        }
        .mini-panel .glow-dot {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            filter: blur(35px);
            opacity: 0.5;
            pointer-events: none;
            animation: dotFloat 5s ease-in-out infinite;
        }
        .mini-panel:nth-child(1) .glow-dot {
            background: var(--magenta);
            top: -20px;
            right: -20px;
        }
        .mini-panel:nth-child(2) .glow-dot {
            background: var(--green);
            bottom: -20px;
            left: -20px;
            animation-delay: -2s;
        }
        .mini-panel:nth-child(3) .glow-dot {
            background: var(--cyan);
            top: 50%;
            left: 50%;
            animation-delay: -4s;
        }
        @keyframes dotFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(15px, -15px) scale(1.3);
            }
            66% {
                transform: translate(-10px, 10px) scale(0.8);
            }
        }

        /* === Top-Right Decorative Element === */
        .deco-ring {
            position: fixed;
            top: -120px;
            right: -120px;
            width: 350px;
            height: 350px;
            border: 2px solid rgba(0, 229, 255, 0.15);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            animation: ringSpin 20s linear infinite;
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.1), inset 0 0 60px rgba(0, 229, 255, 0.05);
        }
        .deco-ring::after {
            content: '';
            position: absolute;
            top: 30px;
            left: 30px;
            right: 30px;
            bottom: 30px;
            border: 1px dashed rgba(255, 0, 229, 0.2);
            border-radius: 50%;
            animation: ringSpin 15s linear infinite reverse;
        }
        @keyframes ringSpin {
            to {
                transform: rotate(360deg);
            }
        }

        /* === Bottom Left Decorative === */
        .deco-hex {
            position: fixed;
            bottom: -80px;
            left: -80px;
            width: 200px;
            height: 200px;
            border: 1px solid rgba(255, 0, 229, 0.12);
            z-index: 1;
            pointer-events: none;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: hexPulse 8s ease-in-out infinite;
        }
        @keyframes hexPulse {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.15) rotate(15deg);
            }
        }

        /* === Scanline Effect === */
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.03) 2px,
                    rgba(0, 0, 0, 0.03) 4px);
            opacity: 0.6;
        }

        /* === Responsive === */
        @media (max-width: 768px) {
            .editor-panel {
                width: 95vw;
                border-radius: 10px;
            }
            .code-content {
                font-size: 11px;
                padding: 14px 12px;
                min-height: 250px;
            }
            .mini-panel {
                width: 140px;
                height: 110px;
                padding: 10px;
            }
            .mini-panel .mini-code {
                font-size: 8px;
            }
            .title-tab {
                font-size: 10px;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Grid Floor -->
    <div class="grid-floor"></div>

    <!-- Decorative Elements -->
    <div class="deco-ring"></div>
    <div class="deco-hex"></div>
    <div class="scanlines"></div>

    <!-- Main Container -->
    <div class="main-container" id="mainContainer">
        <!-- Central Editor Panel -->
        <div class="editor-panel" id="editorPanel">
            <div class="title-bar">
                <div class="title-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="title-text">Terminal — ~/projects/cyber-core</span>
                <div class="title-tab">
                    <span class="dot-indicator"></span>main.rs
                </div>
            </div>
            <div class="code-content">
                <div class="line-numbers" id="lineNumbers"></div>
                <div class="code-lines" id="codeLines"></div>
            </div>
        </div>

        <!-- Mini Panels -->
        <div class="mini-panels">
            <div class="mini-panel" data-tilt>
                <div class="glow-dot"></div>
                <div class="mini-title">⚙️ Config</div>
                <div class="mini-code">
                    <span class="keyword">const</span> <span class="variable">PORT</span>: <span class="type">u16</span> = <span class="number">8080</span>;<br>
                    <span class="keyword">const</span> <span class="variable">HOST</span>: &<span class="type">str</span> = <span class="string">"0.0.0.0"</span>;
                </div>
            </div>
            <div class="mini-panel" data-tilt>
                <div class="glow-dot"></div>
                <div class="mini-title">📦 Dependencies</div>
                <div class="mini-code">
                    <span class="property">tokio</span> = <span class="string">"1.35"</span><br>
                    <span class="property">serde</span> = <span class="string">"1.0"</span><br>
                    <span class="property">axum</span> = <span class="string">"0.7"</span>
                </div>
            </div>
            <div class="mini-panel" data-tilt>
                <div class="glow-dot"></div>
                <div class="mini-title">🔮 Status</div>
                <div class="mini-code">
                    <span class="variable">build</span>: <span style="color:#00ff88;">✓ OK</span><br>
                    <span class="variable">test</span>: <span style="color:#00ff88;">12 passed</span><br>
                    <span class="variable">deploy</span>: <span style="color:#ffd740;">● staging</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ PARTICLE SYSTEM ============
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 120;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.z = Math.random() * 800 + 200;
                this.size = Math.random() * 1.8 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.4 - 0.3;
                this.opacity = Math.random() * 0.7 + 0.2;
                this.hue = Math.random() < 0.33 ? 190 : Math.random() < 0.5 ? 300 : 160;
                this.twinkleSpeed = Math.random() * 0.02 + 0.005;
                this.twinkleOffset = Math.random() * Math.PI * 2;
            }
            update(time) {
                this.x += this.speedX;
                this.y += this.speedY;
                this.opacity = 0.3 + Math.sin(time * this.twinkleSpeed + this.twinkleOffset) * 0.35;
                if (this.y < -20 || this.y > canvas.height + 20 ||
                    this.x < -20 || this.x > canvas.width + 20) {
                    this.reset();
                    this.y = canvas.height + 20;
                }
            }
            draw(ctx) {
                const depthFactor = this.z / 1000;
                const drawSize = this.size * depthFactor * 1.5;
                ctx.beginPath();
                ctx.arc(this.x, this.y, drawSize, 0, Math.PI * 2);
                const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, drawSize * 3);
                glow.addColorStop(0, `hsla(${this.hue}, 100%, 65%, ${this.opacity})`);
                glow.addColorStop(0.5, `hsla(${this.hue}, 100%, 50%, ${this.opacity * 0.3})`);
                glow.addColorStop(1, 'transparent');
                ctx.fillStyle = glow;
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateParticles(timestamp) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update(timestamp);
                p.draw(ctx);
            });
            // Draw connections
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0,229,255,${0.06 * (1 - dist / 100)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        requestAnimationFrame(animateParticles);

        // ============ 3D MOUSE PARALLAX ============
        const mainContainer = document.getElementById('mainContainer');
        const editorPanel = document.getElementById('editorPanel');
        const miniPanels = document.querySelectorAll('.mini-panel');

        let mouseX = 0,
            mouseY = 0;
        let targetX = 0,
            targetY = 0;
        let currentX = 0,
            currentY = 0;

        document.addEventListener('mousemove', (e) => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            targetX = (e.clientX - centerX) / centerX;
            targetY = (e.clientY - centerY) / centerY;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function updateParallax() {
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;

            const rotateY = currentX * 12;
            const rotateX = -currentY * 8;
            const translateZ = Math.abs(currentX) * 15 + Math.abs(currentY) * 10;

            editorPanel.style.transform = `
            rotateX(${rotateX}deg)
            rotateY(${rotateY}deg)
            translateZ(${translateZ}px)
          `;

            miniPanels.forEach((panel, index) => {
                const factor = 1 + index * 0.3;
                const rY = currentX * 18 * factor;
                const rX = -currentY * 14 * factor;
                const tZ = 10 + Math.abs(currentX) * 20 * factor;
                panel.style.transform = `
              rotateX(${rX}deg)
              rotateY(${rY}deg)
              translateZ(${tZ}px)
            `;
            });

            // Move glow on main container based on mouse
            const glowX = 50 + currentX * 20;
            const glowY = 50 + currentY * 20;
            editorPanel.style.boxShadow = `
            0 30px 80px rgba(0,0,0,0.7),
            0 0 0 1px rgba(255,255,255,0.03) inset,
            0 0 40px rgba(0,229,255,${0.3 + Math.abs(currentX) * 0.3}),
            ${-currentX * 25}px ${-currentY * 25}px 60px rgba(255,0,229,0.2)
          `;

            requestAnimationFrame(updateParallax);
        }
        requestAnimationFrame(updateParallax);

        // ============ CODE TYPING ANIMATION ============
        const codeLinesEl = document.getElementById('codeLines');
        const lineNumbersEl = document.getElementById('lineNumbers');

        const codeContent = [
            { text: '<span class="keyword">use</span> <span class="property">std</span>::<span class="property">collections</span>::<span class="type">HashMap</span>;', indent: 0 },
            { text: '<span class="keyword">use</span> <span class="property">tokio</span>::<span class="property">net</span>::<span class="type">TcpListener</span>;', indent: 0 },
            { text: '', indent: 0 },
            {
                text: '<span class="comment">/// Khởi tạo CyberCore Engine v3.2</span>',
                indent: 0
            },
            {
                text: '<span class="keyword">pub async fn</span> <span class="function-name">init_engine</span>(<span class="variable">config</span>: <span class="type">&Config</span>) <span class="keyword">-></span> <span class="type">Result</span><<span class="type">Engine</span>> {',
                indent: 0
            },
            {
                text: '    <span class="keyword">let</span> <span class="variable">registry</span> = <span class="type">HashMap</span>::<span class="function-name">new</span>();',
                indent: 1
            },
            {
                text: '    <span class="keyword">let</span> <span class="variable">listener</span> = <span class="type">TcpListener</span>::<span class="function-name">bind</span>(<span class="string">"0.0.0.0:8080"</span>).<span class="function-name">await</span>?;',
                indent: 1
            },
            { text: '', indent: 0 },
            {
                text: '    <span class="comment">// Thiết lập middleware pipeline</span>',
                indent: 1
            },
            {
                text: '    <span class="keyword">let</span> <span class="variable">pipeline</span> = <span class="type">Pipeline</span>::<span class="function-name">builder</span>()',
                indent: 1
            },
            {
                text: '        .<span class="function-name">add_layer</span>(<span class="type">Logger</span>::<span class="function-name">new</span>(<span class="variable">config</span>.log_level))',
                indent: 2
            },
            {
                text: '        .<span class="function-name">add_layer</span>(<span class="type">Auth</span>::<span class="function-name">with_jwt</span>(<span class="variable">config</span>.secret))',
                indent: 2
            },
            {
                text: '        .<span class="function-name">add_layer</span>(<span class="type">RateLimiter</span>::<span class="function-name">per_second</span>(<span class="number">100</span>))',
                indent: 2
            },
            { text: '        .<span class="function-name">build</span>()?;', indent: 2 },
            { text: '', indent: 0 },
            {
                text: '    <span class="type">Ok</span>(<span class="type">Engine</span> {',
                indent: 1
            },
            {
                text: '        <span class="variable">registry</span>,',
                indent: 2
            },
            {
                text: '        <span class="variable">listener</span>,',
                indent: 2
            },
            {
                text: '        <span class="variable">pipeline</span>,',
                indent: 2
            },
            {
                text: '        <span class="variable">uptime</span>: <span class="type">Instant</span>::<span class="function-name">now</span>(),',
                indent: 2
            },
            { text: '    })', indent: 1 },
            { text: '}', indent: 0 },
        ];

        let currentLineIndex = 0;
        let currentCharIndex = 0;
        let isTyping = true;
        const typingSpeed = 25;
        const pauseBetweenLines = 80;

        function renderAllLines() {
            let html = '';
            let numbersHtml = '';
            for (let i = 0; i < codeContent.length; i++) {
                numbersHtml += `${i + 1}<br>`;
                if (i < currentLineIndex) {
                    html +=
                        `<div class="line" style="opacity:1;">${'&nbsp;&nbsp;'.repeat(codeContent[i].indent)}${codeContent[i].text}</div>`;
                } else if (i === currentLineIndex && isTyping) {
                    const partial = codeContent[i].text.substring(0, currentCharIndex);
                    html +=
                        `<div class="line cursor-line" style="opacity:1;">${'&nbsp;&nbsp;'.repeat(codeContent[i].indent)}${partial}</div>`;
                } else {
                    html +=
                        `<div class="line" style="opacity:0.15;">${'&nbsp;&nbsp;'.repeat(codeContent[i].indent)}${codeContent[i].text}</div>`;
                }
            }
            codeLinesEl.innerHTML = html;
            lineNumbersEl.innerHTML = numbersHtml;
        }

        function typeNextChar() {
            if (currentLineIndex >= codeContent.length) {
                // Reset typing loop
                setTimeout(() => {
                    currentLineIndex = 0;
                    currentCharIndex = 0;
                    isTyping = true;
                    renderAllLines();
                    scheduleTyping();
                }, 4000);
                return;
            }
            const line = codeContent[currentLineIndex];
            if (currentCharIndex < line.text.length) {
                currentCharIndex++;
                renderAllLines();
                scheduleTyping();
            } else {
                // Line complete
                currentCharIndex = 0;
                currentLineIndex++;
                isTyping = true;
                renderAllLines();
                if (currentLineIndex < codeContent.length) {
                    setTimeout(() => {
                        scheduleTyping();
                    }, pauseBetweenLines);
                } else {
                    // All lines done, keep cursor on last line
                    setTimeout(() => {
                        currentLineIndex = codeContent.length;
                        renderAllLines();
                        // Restart after delay
                        setTimeout(() => {
                            currentLineIndex = 0;
                            currentCharIndex = 0;
                            isTyping = true;
                            renderAllLines();
                            scheduleTyping();
                        }, 4000);
                    }, 1500);
                }
            }
        }

        function scheduleTyping() {
            const baseDelay = typingSpeed;
            const variation = Math.random() * 30 - 15;
            setTimeout(typeNextChar, baseDelay + variation);
        }

        // Initial render
        renderAllLines();
        setTimeout(scheduleTyping, 600);

        // ============ MINI PANEL CLICK GLITCH ============
        miniPanels.forEach(panel => {
            panel.addEventListener('click', function() {
                this.style.transform = `translateZ(50px) scale(1.1)`;
                this.style.filter = 'brightness(1.6)';
                setTimeout(() => {
                    this.style.transform = '';
                    this.style.filter = '';
                }, 300);
            });
        });

        // ============ KEYBOARD EASTER EGG ============
        document.addEventListener('keydown', (e) => {
            if (e.key === 'g' && e.ctrlKey) {
                document.body.style.filter = document.body.style.filter === 'hue-rotate(0deg)' ?
                    'hue-rotate(180deg)' : 'hue-rotate(0deg)';
            }
        });

        // ============ TOUCH SUPPORT ============
        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            targetX = (touch.clientX - centerX) / centerX;
            targetY = (touch.clientY - centerY) / centerY;
        }, { passive: true });

        console.log('%c🚀 CyberCore Engine %cv3.2.1 %c| %cReady',
            'color:#00e5ff;font-size:16px;',
            'color:#ff00e5;',
            'color:#fff;',
            'color:#00ff88;');
        console.log('%c┌────────────────────────────────────────┐', 'color:#444;');
        console.log('%c│  \"Mã hóa giao diện 2D nhưng 3D\"      │', 'color:#ffd740;');
        console.log('%c│  Perspective • Parallax • Particles   │', 'color:#61afef;');
        console.log('%c└────────────────────────────────────────┘', 'color:#444;');
    </script>
