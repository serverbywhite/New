<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D Code Layout · Mobile Smooth</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --panel-bg: #111118;
      --border: #1e1e2e;
      --cyan: #00e5ff;
      --magenta: #ff00e5;
      --yellow: #ffd740;
      --green: #00ff88;
      --orange: #ff6d3a;
      --blue: #448aff;
      --text: #c8ccd4;
      --text-dim: #6b6f7b;
      --glow-cyan: 0 0 30px rgba(0, 229, 255, 0.4);
      --glow-magenta: 0 0 30px rgba(255, 0, 229, 0.4);
      --glow-green: 0 0 30px rgba(0, 255, 136, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: crosshair;
      perspective: 1200px;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-x pan-y; /* giữ thao tác chạm nhưng không ảnh hưởng scroll */
    }

    /* Canvas particles - nhẹ hơn */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .grid-floor {
      position: fixed;
      bottom: -20%;
      left: 50%;
      transform: translateX(-50%) rotateX(60deg);
      width: 140vw;
      height: 140vw;
      background: 
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,229,255,0.06) 39px, rgba(0,229,255,0.06) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(0,229,255,0.06) 39px, rgba(0,229,255,0.06) 40px);
      z-index: 0;
      pointer-events: none;
      animation: gridPulse 6s ease-in-out infinite;
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, transparent 70%);
      will-change: opacity;
    }

    @keyframes gridPulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }

    .main-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    /* Editor Panel */
    .editor-panel {
      width: 750px;
      max-width: 92vw;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 
        0 25px 60px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 0 40px rgba(0,229,255,0.25);
      transform-style: preserve-3d;
      transition: box-shadow 0.4s ease;
      position: relative;
      overflow: hidden;
      animation: floatPanel 8s ease-in-out infinite;
      will-change: transform, box-shadow;
      contain: layout style paint;
    }

    .editor-panel::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--cyan), var(--magenta), var(--blue), var(--cyan));
      z-index: -1;
      opacity: 0.45;
      filter: blur(14px);
      background-size: 300% 300%;
      animation: borderGlow 5s linear infinite;
      pointer-events: none;
    }

    .editor-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
    }

    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes floatPanel {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-5px); }
      50% { transform: translateY(-2px); }
      75% { transform: translateY(-7px); }
    }

    .title-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      background: rgba(0,0,0,0.5);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 2;
      flex-wrap: wrap;
    }
    .title-dots {
      display: flex;
      gap: 7px;
    }
    .title-dots span {
      width: 11px; height: 11px;
      border-radius: 50%;
      display: block;
      transition: 0.2s;
      cursor: pointer;
    }
    .title-dots span:nth-child(1) { background: #ff5f57; box-shadow: 0 0 12px #ff5f57; }
    .title-dots span:nth-child(2) { background: #ffbd2e; box-shadow: 0 0 12px #ffbd2e; }
    .title-dots span:nth-child(3) { background: #28ca41; box-shadow: 0 0 12px #28ca41; }
    .title-dots span:active { transform: scale(1.2); filter: brightness(1.4); }
    .title-text {
      color: var(--text-dim);
      font-size: 12px;
      margin-left: 8px;
      letter-spacing: 0.5px;
    }
    .title-tab {
      background: var(--panel-bg);
      color: var(--text);
      font-size: 12px;
      padding: 6px 16px;
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      margin-left: 20px;
      position: relative;
      top: 1px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot-indicator {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: dotBlink 2s infinite;
    }
    @keyframes dotBlink {
      0%,100%{opacity:1; box-shadow:0 0 6px var(--green);}
      50%{opacity:0.3; box-shadow:0 0 2px var(--green);}
    }

    .code-content {
      padding: 20px 24px;
      position: relative;
      z-index: 2;
      min-height: 320px;
      font-size: 13.5px;
      line-height: 2;
      letter-spacing: 0.2px;
      color: var(--text);
      overflow: hidden;
    }
    .line-numbers {
      position: absolute;
      left: 20px;
      top: 20px;
      color: #3a3d4a;
      font-size: 13px;
      line-height: 2;
      text-align: right;
      width: 30px;
      pointer-events: none;
      z-index: 1;
    }
    .code-lines {
      padding-left: 45px;
      position: relative;
      z-index: 1;
    }
    .code-lines .line {
      white-space: pre;
      transition: opacity 0.2s;
    }
    .cursor-line::after {
      content: '▎';
      color: var(--cyan);
      animation: cursorBlink 1s step-end infinite;
      margin-left: 2px;
      font-size: 14px;
    }
    @keyframes cursorBlink {
      0%,100%{opacity:1;}
      50%{opacity:0;}
    }

    .keyword { color: #c678dd; font-weight: 600; }
    .function-name { color: #61afef; font-weight: 500; }
    .string { color: #98c379; }
    .comment { color: #5c6370; font-style: italic; }
    .number { color: #d19a66; }
    .type { color: #e5c07b; }
    .operator { color: #abb2bf; }
    .variable { color: #e06c75; }
    .bracket { color: #ffd740; }
    .property { color: #56b6c2; }
    .tag { color: #e06c75; }
    .attr { color: #d19a66; }

    /* Mini Panels */
    .mini-panels {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      transform-style: preserve-3d;
    }
    .mini-panel {
      width: 200px;
      height: 140px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.2s ease;
      cursor: pointer;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      overflow: hidden;
      will-change: transform;
      contain: layout style paint;
    }
    .mini-panel:nth-child(1) { box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 25px rgba(255,0,229,0.25); }
    .mini-panel:nth-child(2) { box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 25px rgba(0,255,136,0.25); }
    .mini-panel:nth-child(3) { box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 25px rgba(0,229,255,0.25); }
    .mini-panel:active {
      transform: translateZ(35px) scale(1.02);
    }
    .mini-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }
    .mini-code {
      font-size: 10px;
      line-height: 1.9;
      color: var(--text);
      position: relative;
      z-index: 1;
      opacity: 0.9;
    }
    .glow-dot {
      position: absolute;
      width: 50px; height: 50px;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.5;
      pointer-events: none;
      animation: dotFloat 6s infinite;
    }
    .mini-panel:nth-child(1) .glow-dot { background: var(--magenta); top: -20px; right: -20px; }
    .mini-panel:nth-child(2) .glow-dot { background: var(--green); bottom: -20px; left: -20px; animation-delay: -2s; }
    .mini-panel:nth-child(3) .glow-dot { background: var(--cyan); top: 40%; left: 40%; animation-delay: -4s; }
    @keyframes dotFloat {
      0%,100%{ transform: translate(0,0) scale(1); }
      33%{ transform: translate(12px,-12px) scale(1.2); }
      66%{ transform: translate(-8px,8px) scale(0.85); }
    }

    .deco-ring {
      position: fixed;
      top: -120px; right: -120px;
      width: 300px; height: 300px;
      border: 2px solid rgba(0,229,255,0.1);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
      animation: ringSpin 30s linear infinite;
      opacity: 0.7;
    }
    .deco-ring::after {
      content: '';
      position: absolute;
      inset: 25px;
      border: 1px dashed rgba(255,0,229,0.15);
      border-radius: 50%;
      animation: ringSpin 20s linear infinite reverse;
    }
    @keyframes ringSpin { to { transform: rotate(360deg); } }

    .deco-hex {
      position: fixed;
      bottom: -80px; left: -80px;
      width: 180px; height: 180px;
      border: 1px solid rgba(255,0,229,0.1);
      z-index: 1;
      pointer-events: none;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      animation: hexPulse 10s infinite;
    }
    @keyframes hexPulse {
      0%,100%{opacity:0.3; transform:scale(1);}
      50%{opacity:0.6; transform:scale(1.1) rotate(10deg);}
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px);
      opacity: 0.5;
    }

    /* Mobile optimization */
    @media (max-width: 768px) {
      .editor-panel {
        width: 95vw;
        border-radius: 12px;
        animation-duration: 10s;
      }
      .code-content {
        font-size: 11px;
        padding: 14px 12px;
        min-height: 240px;
        line-height: 1.9;
      }
      .mini-panel {
        width: 140px;
        height: 115px;
        padding: 12px;
      }
      .mini-code { font-size: 9px; }
      .title-tab { font-size: 10px; padding: 4px 10px; }
      .title-text { display: none; }
      .deco-ring, .deco-hex { opacity: 0.4; }
      .grid-floor { animation-duration: 8s; }
    }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>
  <div class="grid-floor"></div>
  <div class="deco-ring"></div>
  <div class="deco-hex"></div>
  <div class="scanlines"></div>

  <div class="main-container" id="mainContainer">
    <div class="editor-panel" id="editorPanel">
      <div class="title-bar">
        <div class="title-dots"><span></span><span></span><span></span></div>
        <span class="title-text">~/projects/cyber-core</span>
        <div class="title-tab"><span class="dot-indicator"></span>main.rs</div>
      </div>
      <div class="code-content">
        <div class="line-numbers" id="lineNumbers"></div>
        <div class="code-lines" id="codeLines"></div>
      </div>
    </div>

    <div class="mini-panels">
      <div class="mini-panel">
        <div class="glow-dot"></div>
        <div class="mini-title">⚙️ Config</div>
        <div class="mini-code"><span class="keyword">const</span> <span class="variable">PORT</span>: <span class="type">u16</span> = <span class="number">8080</span>;<br><span class="keyword">const</span> <span class="variable">HOST</span>: &<span class="type">str</span> = <span class="string">"0.0.0.0"</span>;</div>
      </div>
      <div class="mini-panel">
        <div class="glow-dot"></div>
        <div class="mini-title">📦 Deps</div>
        <div class="mini-code"><span class="property">tokio</span> = <span class="string">"1.35"</span><br><span class="property">serde</span> = <span class="string">"1.0"</span><br><span class="property">axum</span> = <span class="string">"0.7"</span></div>
      </div>
      <div class="mini-panel">
        <div class="glow-dot"></div>
        <div class="mini-title">🔮 Status</div>
        <div class="mini-code"><span class="variable">build</span>: <span style="color:#00ff88;">✓ OK</span><br><span class="variable">test</span>: <span style="color:#00ff88;">12 passed</span><br><span class="variable">deploy</span>: <span style="color:#ffd740;">● staging</span></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ========== TỐI ƯU MOBILE: GIẢM SỐ LƯỢNG HẠT, BỎ KẾT NỐI ==========
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      const isMobile = window.innerWidth < 768;
      const PARTICLE_COUNT = isMobile ? 30 : 50;
      let particles = [];
      let animFrame;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', () => {
        resizeCanvas();
        // Khởi tạo lại hạt khi resize để tránh vị trí lỗi
        initParticles();
      });

      function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speedX: (Math.random() - 0.5) * 0.4,
            speedY: (Math.random() - 0.5) * 0.3 - 0.2,
            hue: [190, 300, 160][Math.floor(Math.random() * 3)],
            opacity: Math.random() * 0.6 + 0.2,
          });
        }
      }
      initParticles();

      function drawParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let p of particles) {
          p.x += p.speedX;
          p.y += p.speedY;
          if (p.y < -20 || p.y > canvas.height + 20 || p.x < -20 || p.x > canvas.width + 20) {
            p.x = Math.random() * canvas.width;
            p.y = canvas.height + 20;
          }
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
          grad.addColorStop(0, `hsla(${p.hue}, 100%, 65%, ${p.opacity})`);
          grad.addColorStop(0.6, `hsla(${p.hue}, 100%, 50%, 0)`);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
          ctx.fillStyle = grad;
          ctx.fill();
        }
        animFrame = requestAnimationFrame(drawParticles);
      }
      drawParticles();

      // ========== PARALLAX 3D NHẸ HƠN ==========
      const mainContainer = document.getElementById('mainContainer');
      const editorPanel = document.getElementById('editorPanel');
      const miniPanels = document.querySelectorAll('.mini-panel');

      let targetX = 0, targetY = 0;
      let currentX = 0, currentY = 0;
      let rafId;

      function updateMouse(e) {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        targetX = (e.clientX - cx) / cx;
        targetY = (e.clientY - cy) / cy;
      }

      document.addEventListener('mousemove', updateMouse, { passive: true });
      document.addEventListener('touchmove', (e) => {
        if (e.touches.length) {
          const t = e.touches[0];
          updateMouse(t);
        }
      }, { passive: true });

      function parallaxLoop() {
        currentX += (targetX - currentX) * 0.06;
        currentY += (targetY - currentY) * 0.06;

        const rotateY = currentX * 10;
        const rotateX = -currentY * 6;
        const tz = Math.abs(currentX) * 8 + Math.abs(currentY) * 6;

        // Chỉ cập nhật transform, không thay đổi box-shadow động
        editorPanel.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(${tz}px)`;
        
        miniPanels.forEach((panel, i) => {
          const factor = 1 + i * 0.25;
          const rY = currentX * 15 * factor;
          const rX = -currentY * 12 * factor;
          const tzPanel = 8 + Math.abs(currentX) * 15 * factor;
          panel.style.transform = `rotateX(${rX}deg) rotateY(${rY}deg) translateZ(${tzPanel}px)`;
        });

        rafId = requestAnimationFrame(parallaxLoop);
      }
      parallaxLoop();

      // Dọn dẹp khi trang unload (không bắt buộc nhưng tốt)
      window.addEventListener('beforeunload', () => {
        cancelAnimationFrame(animFrame);
        cancelAnimationFrame(rafId);
      });

      // ========== CODE TYPING (GIẢM TẦN SUẤT, DỪNG SAU KHI HOÀN THÀNH ĐỂ GIẢM CPU) ==========
      const codeLinesEl = document.getElementById('codeLines');
      const lineNumbersEl = document.getElementById('lineNumbers');

      const codeContent = [
        { text: '<span class="keyword">use</span> <span class="property">std</span>::<span class="property">collections</span>::<span class="type">HashMap</span>;', indent:0 },
        { text: '<span class="keyword">use</span> <span class="property">tokio</span>::<span class="property">net</span>::<span class="type">TcpListener</span>;', indent:0 },
        { text: '', indent:0 },
        { text: '<span class="comment">/// Khởi tạo CyberCore Engine v3.2</span>', indent:0 },
        { text: '<span class="keyword">pub async fn</span> <span class="function-name">init_engine</span>(<span class="variable">config</span>: <span class="type">&Config</span>) <span class="keyword">-></span> <span class="type">Result</span><<span class="type">Engine</span>> {', indent:0 },
        { text: '    <span class="keyword">let</span> <span class="variable">registry</span> = <span class="type">HashMap</span>::<span class="function-name">new</span>();', indent:1 },
        { text: '    <span class="keyword">let</span> <span class="variable">listener</span> = <span class="type">TcpListener</span>::<span class="function-name">bind</span>(<span class="string">"0.0.0.0:8080"</span>).<span class="function-name">await</span>?;', indent:1 },
        { text: '', indent:0 },
        { text: '    <span class="comment">// Thiết lập middleware pipeline</span>', indent:1 },
        { text: '    <span class="keyword">let</span> <span class="variable">pipeline</span> = <span class="type">Pipeline</span>::<span class="function-name">builder</span>()', indent:1 },
        { text: '        .<span class="function-name">add_layer</span>(<span class="type">Logger</span>::<span class="function-name">new</span>(<span class="variable">config</span>.log_level))', indent:2 },
        { text: '        .<span class="function-name">add_layer</span>(<span class="type">Auth</span>::<span class="function-name">with_jwt</span>(<span class="variable">config</span>.secret))', indent:2 },
        { text: '        .<span class="function-name">add_layer</span>(<span class="type">RateLimiter</span>::<span class="function-name">per_second</span>(<span class="number">100</span>))', indent:2 },
        { text: '        .<span class="function-name">build</span>()?;', indent:2 },
        { text: '', indent:0 },
        { text: '    <span class="type">Ok</span>(<span class="type">Engine</span> {', indent:1 },
        { text: '        <span class="variable">registry</span>,', indent:2 },
        { text: '        <span class="variable">listener</span>,', indent:2 },
        { text: '        <span class="variable">pipeline</span>,', indent:2 },
        { text: '        <span class="variable">uptime</span>: <span class="type">Instant</span>::<span class="function-name">now</span>(),', indent:2 },
        { text: '    })', indent:1 },
        { text: '}', indent:0 },
      ];

      let currentLine = 0;
      let currentChar = 0;
      let typingTimer;

      function renderCode(fullLineIndex = -1, partialChars = 0) {
        let html = '', nums = '';
        for (let i = 0; i < codeContent.length; i++) {
          nums += `${i+1}<br>`;
          if (i < fullLineIndex) {
            html += `<div class="line" style="opacity:1;">${'&nbsp;&nbsp;'.repeat(codeContent[i].indent)}${codeContent[i].text}</div>`;
          } else if (i === fullLineIndex) {
            const part = codeContent[i].text.substring(0, partialChars);
            html += `<div class="line cursor-line" style="opacity:1;">${'&nbsp;&nbsp;'.repeat(codeContent[i].indent)}${part}</div>`;
          } else {
            html += `<div class="line" style="opacity:0.15;">${'&nbsp;&nbsp;'.repeat(codeContent[i].indent)}${codeContent[i].text}</div>`;
          }
        }
        codeLinesEl.innerHTML = html;
        lineNumbersEl.innerHTML = nums;
      }

      function typeStep() {
        if (currentLine >= codeContent.length) {
          // Hoàn thành, dừng typing để giải phóng CPU, giữ nguyên màn hình
          renderCode(codeContent.length, 0); // hiển thị đầy đủ
          return;
        }
        const line = codeContent[currentLine];
        if (currentChar < line.text.length) {
          currentChar++;
          renderCode(currentLine, currentChar);
          typingTimer = setTimeout(typeStep, isMobile ? 45 : 28);
        } else {
          currentChar = 0;
          currentLine++;
          renderCode(currentLine, 0);
          typingTimer = setTimeout(typeStep, isMobile ? 120 : 70);
        }
      }

      // Bắt đầu typing sau 500ms
      setTimeout(() => {
        renderCode(0, 0);
        typeStep();
      }, 500);

      // Dừng typing nếu cần (khi rời trang)
      window.addEventListener('beforeunload', () => {
        clearTimeout(typingTimer);
      });

      // Mini panel tap feedback (nhẹ)
      document.querySelectorAll('.mini-panel').forEach(panel => {
        panel.addEventListener('click', function(e) {
          this.style.transform = 'translateZ(40px) scale(1.04)';
          setTimeout(() => { this.style.transform = ''; }, 200);
        });
      });

      console.log('%c⚡ Mobile Optimized Cyberpunk Layout %c| Smooth 60fps',
        'color:#00e5ff;', 'color:#ccc;');
    })();
  </script>
</body>
</html>
